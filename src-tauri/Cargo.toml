[package]
name = "sonotune"
version = "1.1.2"
description = "A local music player for Windows"
license = "MIT"
authors = ["SonoTune"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "sonotune_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
dunce = "1"
lofty = "0.25.4"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm", "symphonia-aac", "symphonia-isomp4"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "vorbis", "ogg", "wav", "pcm", "aac", "alac", "isomp4"] }
symphonia-adapter-libopus = "0.2.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Media_Devices", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
