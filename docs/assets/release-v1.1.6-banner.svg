<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SonoTune 1.1.6 — Big Update</title>
  <desc id="desc">SonoTune 1.1.6 Big Update banner in soft dark plum and lilac tones, featuring the SonoTune flower emblem, flowing waves, and a minimal spectrum accent.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="36"/></clipPath>
    <clipPath id="pebble"><path d="M920 234c-32-95 146-129 205-45s21 173-58 171-111-16-147-126Z"/></clipPath>
  </defs>
