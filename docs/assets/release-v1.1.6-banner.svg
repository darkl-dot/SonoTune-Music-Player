    <text x="62" y="68" fill="#c9aadd" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">BIG UPDATE  ·  RELEASE</text>
    <text x="58" y="159" fill="#f2eaf6" font-family="Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-3">SonoTune <tspan fill="#ceafe4" font-weight="700" letter-spacing="-2">1.1.6</tspan></text>
    <text x="62" y="216" fill="#f2eaf6" font-family="Arial, sans-serif" font-size="28" letter-spacing="-.6">Mini player. Even levels. 18 new themes.</text>
    <text x="62" y="255" fill="#bfb0c8" font-family="Arial, sans-serif" font-size="16.5">Sleep timer, custom EQ presets, M3U8 playlists &amp; library cleanup.</text>
