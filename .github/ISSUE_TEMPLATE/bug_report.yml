name: Bug report
description: Something is not working as expected.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: SonoTune and Windows versions
      placeholder: 'SonoTune 0.5.0, Windows 11'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the file format and playback mode if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or a freely shareable sample can help.
    validations:
      required: true
